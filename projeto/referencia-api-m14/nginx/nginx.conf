# Não registrar a query string: no WebSocket o token JWT vai nela (?token=...) e vazaria para os logs.
log_format sem_query '$remote_addr [$time_local] rid=$request_id "$request_method $uri" $status $body_bytes_sent rt=$request_time "$http_user_agent"';


# O Nginx resolve nomes UMA VEZ ao iniciar. Se o `web` for recriado (novo IP) num deploy, um `proxy_pass` com nome fixo continuaria
# apontando para o IP antigo e responderia 502. Com `resolver` + variável, o nome é re-resolvido a cada 10 s (DNS do Docker: 127.0.0.11).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sem_query;
    return 301 https://$host:8443$request_uri;     # em produção: https://$host$request_uri
}

server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log sem_query;   # no nível do server: SUBSTITUI o log padrão herdado
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    client_max_body_size 5m;                       # corpo maior que isso: 413, sem incomodar o Django

    # Estáticos: o Nginx responde sozinho, sem acordar o Python.
    location /static/ {
        root /usr/share/nginx/html;
        expires 7d;
    }

    # WebSocket (ASGI): precisa dos cabeçalhos de upgrade.
    location /ws/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;   # preserva a porta (útil em desenvolvimento)
        proxy_read_timeout 60s;
    }

    # Métricas são INTERNAS (o Prometheus raspa web:8000 direto, pela rede do Compose): para o mundo, não existem.
    location /metrics/ {
        return 404;
    }

    # Todo o resto vai para o Django.
    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header X-Request-ID $request_id;       # o mesmo ID aparece no log do Nginx e no do Django (aula 14.01)
        proxy_set_header Host $http_host;   # preserva a porta (útil em desenvolvimento)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # sem isto o Django acha que é HTTP e redireciona em laço
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
