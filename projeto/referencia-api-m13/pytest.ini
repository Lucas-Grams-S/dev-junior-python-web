[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
addopts = --strict-markers
markers =
    unidade: não toca o banco nem a rede (milissegundos)
    integracao: usa o banco (serviços, repositórios, tarefas)
    api: atravessa HTTP/DRF (rotas, permissões, serialização)
asyncio_default_fixture_loop_scope = function
env =
    DEBUG=1
