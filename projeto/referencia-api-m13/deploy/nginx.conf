# Sem domínio e sem TLS: SÓ para estudo. Em produção de verdade: domínio + HTTPS (ACM + balanceador, ou Let's Encrypt).
log_format sem_query '$remote_addr [$time_local] rid=$request_id "$request_method $uri" $status $body_bytes_sent rt=$request_time';


# O Nginx resolve nomes UMA VEZ ao iniciar. Se o `web` for recriado (novo IP) num deploy, um `proxy_pass` com nome fixo continuaria
# apontando para o IP antigo e responderia 502. Com `resolver` + variável, o nome é re-resolvido a cada 10 s (DNS do Docker: 127.0.0.11).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log sem_query;
    client_max_body_size 5m;

    location /static/ {
        root /usr/share/nginx/html;
        expires 7d;
    }

    location /ws/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
    }

    # Métricas são INTERNAS (o Prometheus raspa web:8000 direto, pela rede do Compose): para o mundo, não existem.
    location /metrics/ {
        return 404;
    }

    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header X-Request-ID $request_id;       # o mesmo ID aparece no log do Nginx e no do Django (aula 14.01)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
