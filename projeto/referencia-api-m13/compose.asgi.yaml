# Uso: docker compose -f compose.yaml -f compose.asgi.yaml up -d
# Troca o servidor do "web" por Uvicorn (ASGI), necessário para WebSocket.
services:
  web:
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-server-header"]
