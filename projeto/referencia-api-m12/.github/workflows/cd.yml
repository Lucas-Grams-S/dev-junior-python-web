name: CD

# Roda DEPOIS que o código chegou à main (ou quando uma tag de versão é criada).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false      # um deploy em andamento não deve ser cancelado no meio

jobs:
  publish:
    name: Publicar a imagem no GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write            # só ESTE job pode publicar pacotes
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     # token temporário do próprio workflow: nada para cadastrar
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy em staging
    needs: publish
    runs-on: ubuntu-24.04
    environment: staging          # variáveis e segredos DESTE ambiente
    steps:
      - name: Deploy (o passo real chega no módulo 13)
        run: echo "Subiria ${{ needs.publish.outputs.tags }} em staging"

  deploy-production:
    name: Deploy em produção
    needs: [publish, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')      # só tags de versão chegam à produção
    runs-on: ubuntu-24.04
    environment: production       # configure "Required reviewers": o job PAUSA até alguém aprovar
    steps:
      - name: Deploy (o passo real chega no módulo 13)
        run: echo "Subiria ${{ needs.publish.outputs.tags }} em produção"
